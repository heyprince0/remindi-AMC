      background: radial-gradient(circle at 35% 35%, #2a3550, #05060a 70%);
      box-shadow: 0 0 0 1px rgba(255,255,255,.05) inset;
    }

    /* Screen */
    .phone-screen {
      position: relative;
      background: #f8fafc;
      border-radius: 36px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Glass glare */
    .phone-screen::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 32%);
      pointer-events: none;
      border-radius: inherit;
      z-index: 30;
    }

    /* Status bar + header share gradient */
    .mob-hero-bg {
      position: relative;
      background: linear-gradient(155deg, #33b6e8 0%, #1a7faa 100%);
      padding: 8px 14px 16px;
      overflow: hidden;
    }
    .mob-hero-bg::after {
      content: '';
      position: absolute; top: -46px; right: -46px;
      width: 150px; height: 150px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,.2), transparent 70%);
      pointer-events: none;
    }
    .mob-statusbar { display: flex; align-items: center; justify-content: space-between; color: #fff; margin-bottom: 12px; position: relative; z-index: 1; }
    .mob-time { font-size: .55rem; font-weight: 700; letter-spacing: .02em; }
    .mob-icons { display: flex; align-items: center; gap: 4px; }
    .mob-icons svg { width: 11px; height: 11px; opacity: .95; }

    .mob-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; position: relative; z-index: 1; }
    .mob-brand { display: flex; align-items: center; gap: 6px; font-size: .68rem; font-weight: 800; color: #fff; letter-spacing: -.01em; }
    .mob-logo { width: 21px; height: 21px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .mob-logo svg { width: 11px; height: 11px; color: var(--blue); }
    .mob-bell { width: 27px; height: 27px; background: rgba(255,255,255,.18); border-radius: 8px; display: flex; align-items: center; justify-content: center; position: relative; }
    .mob-bell svg { width: 12px; height: 12px; color: #fff; }
    .mob-bell-dot { position: absolute; top: 5px; right: 5px; width: 5px; height: 5px; background: #ef4444; border-radius: 50%; border: 1.5px solid #2ab0e0; }

    .mob-hello { font-size: .56rem; color: rgba(255,255,255,.78); font-weight: 400; position: relative; z-index: 1; }
    .mob-name { font-size: .86rem; font-weight: 800; color: #fff; margin-bottom: 12px; position: relative; z-index: 1; }

    .mob-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; position: relative; z-index: 1; }
    .mob-sum-card { background: rgba(255,255,255,.16); border-radius: 11px; padding: 9px 11px; border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(4px); }
    .mob-sum-lbl { display: block; font-size: .49rem; color: rgba(255,255,255,.72); font-weight: 500; margin-bottom: 2px; }
    .mob-sum-val { display: block; font-size: .95rem; font-weight: 800; color: #fff; line-height: 1.1; }
    .mob-sum-sub { display: block; font-size: .45rem; color: rgba(255,255,255,.65); margin-top: 2px; }

    /* Body */
    .mob-body { padding: 11px 11px 6px; flex: 1; }
    .mob-section-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .mob-section-title { font-size: .6rem; font-weight: 700; color: var(--gray-700); }
    .mob-see-all { font-size: .52rem; color: var(--blue); font-weight: 600; }

    .mob-card { display: flex; align-items: center; gap: 9px; background: #fff; border: 1px solid var(--gray-100); border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; box-shadow: 0 1px 3px rgba(15,23,42,.05); }
    .mob-card:last-child { margin-bottom: 0; }
    .mob-card-icon { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: .82rem; flex-shrink: 0; }
    .mob-card-icon.red { background: #fee2e2; }
    .mob-card-icon.amber { background: #fef3c7; }
    .mob-card-icon.sky { background: #e0f5fc; }
    .mob-card-icon.green { background: #dcfce7; }
    .mob-card-body { flex: 1; min-width: 0; }
    .mob-card-name { font-size: .6rem; font-weight: 700; color: var(--gray-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mob-card-sub { font-size: .51rem; color: var(--gray-400); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mob-card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
    .mob-badge { font-size: .43rem; font-weight: 700; padding: 2px 6px; border-radius: 999px; white-space: nowrap; }
    .mob-badge.red { background: #fee2e2; color: #dc2626; }
    .mob-badge.amber { background: #fef3c7; color: #b45309; }
    .mob-badge.sky { background: #e0f5fc; color: var(--blue-deep); }
    .mob-badge.green { background: #dcfce7; color: #16a34a; }
    .mob-date { font-size: .45rem; color: var(--gray-400); font-weight: 500; }

    /* Footer nav */
    .mob-footer { background: #fff; border-top: 1px solid var(--gray-100); padding-bottom: 6px; }
    .mob-bottomnav { display: flex; justify-content: space-around; align-items: center; padding: 8px 8px 6px; }
    .mob-nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; }
    .mob-nav-item svg { width: 15px; height: 15px; color: var(--gray-300); }
    .mob-nav-item.active svg { color: var(--blue); }
    .mob-nav-label { font-size: .42rem; font-weight: 500; color: var(--gray-300); }
    .mob-nav-item.active .mob-nav-label { color: var(--blue); font-weight: 700; }
    .mob-home-indicator { width: 72px; height: 4px; border-radius: 2px; background: rgba(15,23,42,.22); margin: 0 auto 2px; }

    /* ── FLOATING CARDS ── */
    .float-card {
      position: absolute;
      background: #fff;
      border-radius: 12px;
      padding: 11px 14px;
      box-shadow: 0 10px 34px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.08);
      display: flex; align-items: center; gap: 10px;
      z-index: 10;
      animation: floatAnim 3.6s ease-in-out infinite;
    }
    @keyframes floatAnim {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .float-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: .95rem; flex-shrink: 0; }
    .float-icon.blue { background: rgba(41,171,226,.15); }
    .float-icon.green { background: #f0fdf4; }
    .float-icon.red { background: #fee2e2; }
    .float-text strong { display: block; font-size: .72rem; font-weight: 700; color: var(--gray-900); line-height: 1.3; }
    .float-text span { font-size: .62rem; color: var(--gray-500); line-height: 1.3; }

    .float-alert { top: -34px; right: -52px; animation-delay: .4s; }
    .float-success { bottom: 96px; left: -70px; animation-delay: 1.4s; }
    .float-renew { top: 30px; right: -78px; animation-delay: 2.2s; }

    /* Device labels */
    .device-label {
      position: absolute; bottom: calc(100% + 14px); left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px; padding: 4px 13px;
      font-size: .66rem; font-weight: 600; color: rgba(255,255,255,.75);
      white-space: nowrap; backdrop-filter: blur(8px);
      display: flex; align-items: center; gap: 6px;
      letter-spacing: .02em;
    }
    .device-label-dot { width: 5px; height: 5px; background: var(--blue); border-radius: 50%; box-shadow: 0 0 8px var(--blue); }

    /* Bottom fade into next section */
    .stage-bottom-fade {
      position: absolute; left: 0; right: 0; bottom: 0;
      height: 96px;
      background: linear-gradient(to bottom, rgba(11,14,24,0) 0%, #0b0e18 14%, #f8fafc 100%);
      pointer-events: none;
      z-index: 4;
    }

    /* ── INSTALL SECTION ── */
    .install-section { background: var(--gray-50); }
    .install-card { background: #fff; border: 1px solid var(--gray-200); border-radius: 22px; padding: 60px 44px; text-align: center; max-width: 760px; margin: 0 auto; box-shadow: var(--shadow-md); }
    .install-icon-wrap { font-size: 2.8rem; margin-bottom: 14px; line-height: 1; }
    .install-card h2 { font-size: clamp(1.6rem,3.5vw,2.2rem); font-weight: 800; color: var(--gray-900); margin-bottom: 12px; letter-spacing: -.02em; }
    .install-card > p { font-size: 1rem; color: var(--gray-500); max-width: 480px; margin: 0 auto 24px; line-height: 1.7; }

    /* ── GUIDE SECTION ── */
    .guide-section { background: #fff; }
    .guide-tabs { display: flex; gap: 10px; margin-bottom: 44px; justify-content: center; flex-wrap: wrap; }
    .guide-tab { display: flex; align-items: center; gap: 8px; background: #fff; border: 2px solid var(--gray-200); border-radius: 10px; padding: 10px 20px; font-size: .88rem; font-weight: 600; color: var(--gray-600); cursor: pointer; transition: all .2s; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
    .guide-tab.active { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }
    .guide-tab svg { width: 18px; height: 18px; flex-shrink: 0; }
    .guide-tab:hover:not(.active) { border-color: var(--gray-300); color: var(--gray-700); }
    .guide-panel { display: none; }
    .guide-panel.active { display: block; animation: fadeUp .35s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .steps-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; }
    .step-card { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 32px 26px; position: relative; transition: transform .2s, box-shadow .2s, border-color .2s; }
    .step-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--blue); }
    .step-num { position: absolute; top: 22px; right: 22px; width: 32px; height: 32px; border-radius: 50%; background: rgba(41,171,226,.1); color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: .8rem; font-weight: 800; }
    .step-icon { width: 54px; height: 54px; background: rgba(41,171,226,.10); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 18px; }
    .step-card h3 { font-size: 1rem; font-weight: 700; color: var(--gray-900); margin-bottom: 8px; }
    .step-card p { font-size: .85rem; color: var(--gray-500); line-height: 1.65; }
    .step-card p strong { color: var(--gray-700); }

    /* ── WHY SECTION ── */
    .why-section { background: var(--gray-50); }
    .why-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 24px; margin-top: 52px; }
    .why-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 28px; transition: transform .2s, box-shadow .2s, border-color .2s; }
    .why-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--blue); }
    .why-icon { width: 48px; height: 48px; background: rgba(41,171,226,.10); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-bottom: 16px; }
    .why-card h3 { font-size: .95rem; font-weight: 700; color: var(--gray-900); margin-bottom: 8px; }
    .why-card p { font-size: .83rem; color: var(--gray-500); line-height: 1.65; }

    /* ── PLATFORM SECTION ── */
    .platform-section { background: #fff; }
    .platform-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 24px; margin-top: 48px; max-width: 900px; margin-left: auto; margin-right: auto; }
    .platform-card { background: var(--gray-50); border: 1.5px solid var(--gray-200); border-radius: 16px; padding: 30px; display: flex; align-items: flex-start; gap: 18px; transition: transform .2s, box-shadow .2s, border-color .2s; }
    .platform-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--blue); }
    .platform-icon { width: 54px; height: 54px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; flex-shrink: 0; }
    .platform-icon.android { background: #e8f5e9; }
    .platform-icon.ios { background: #f3f4f6; }
    .platform-icon.windows { background: #eff6ff; }
    .platform-icon.mac { background: #f9fafb; }
    .platform-info h3 { font-size: 1.05rem; font-weight: 700; color: var(--gray-900); margin-bottom: 6px; }
    .platform-info p { font-size: .83rem; color: var(--gray-500); line-height: 1.6; margin-bottom: 14px; }
    .platform-steps { list-style: none; display: flex; flex-direction: column; gap: 5px; }
    .platform-steps li { font-size: .8rem; color: var(--gray-600); display: flex; align-items: flex-start; gap: 6px; line-height: 1.5; }
    .platform-steps li::before { content: '→'; color: var(--blue); font-weight: 700; flex-shrink: 0; }

    /* ── CTA ── */
    .cta-section { background: linear-gradient(135deg, var(--blue) 0%, var(--blue-deep) 100%); padding: 96px 24px; text-align: center; position: relative; overflow: hidden; }
    .cta-section::before { content: ''; position: absolute; top: -100px; right: -100px; width: 500px; height: 500px; background: radial-gradient(circle, rgba(255,255,255,.08) 0%, transparent 70%); pointer-events: none; }
    .cta-section h2 { font-size: clamp(1.8rem,4vw,2.8rem); font-weight: 800; color: #fff; margin-bottom: 16px; letter-spacing: -.02em; }
    .cta-section p { font-size: 1.05rem; color: rgba(255,255,255,.85); max-width: 520px; margin: 0 auto 36px; line-height: 1.7; }
    .btn-cta-white { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: #fff; color: var(--blue); padding: 17px 38px; border-radius: 12px; font-size: 1.02rem; font-weight: 700; text-decoration: none; border: none; cursor: pointer; font-family: 'Poppins', sans-serif; transition: transform .15s, box-shadow .2s; -webkit-tap-highlight-color: transparent; }
    .btn-cta-white:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,.22); }
    .btn-cta-ghost { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.15); color: #fff; border: 2px solid rgba(255,255,255,.4); padding: 15px 30px; border-radius: 12px; font-size: 1rem; font-weight: 600; text-decoration: none; transition: background .2s; }
    .btn-cta-ghost:hover { background: rgba(255,255,255,.24); }
    .cta-note { margin-top: 20px; font-size: .82rem; color: rgba(255,255,255,.7); }

    /* ── FOOTER ── */
    .footer { background: var(--gray-900); color: var(--gray-300); padding: 64px 24px 32px; }
    .footer-inner { max-width: 1200px; margin: 0 auto; }
    .footer-top { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 48px; margin-bottom: 48px; }
    .footer-brand .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 16px; }
    .footer-brand .logo img { height: 36px; width: 36px; border-radius: 8px; }
    .footer-brand .logo span { font-size: 1.25rem; font-weight: 700; color: #fff; }
    .footer-brand p { font-size: .85rem; line-height: 1.7; color: var(--gray-500); max-width: 260px; }
    .footer-col h4 { font-size: .88rem; font-weight: 700; color: #fff; margin-bottom: 16px; }
    .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .footer-col ul li a { text-decoration: none; font-size: .83rem; color: var(--gray-500); transition: color .2s; }
    .footer-col ul li a:hover { color: var(--blue); }
    .footer-divider { border: none; border-top: 1px solid rgba(255,255,255,.06); margin-bottom: 24px; }
    .footer-bottom { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .footer-bottom p { font-size: .8rem; color: var(--gray-600); }
    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }
    .footer-links a { font-size: .8rem; color: var(--gray-600); text-decoration: none; transition: color .2s; }
    .footer-links a:hover { color: var(--blue); }

    /* ════════════════════════════════════════
       RESPONSIVE
    ════════════════════════════════════════ */
    @media (max-width: 1080px) {
      .stage-inner { gap: 28px; }
      .desktop-wrap { max-width: 640px; }
      .phone-wrap { width: 232px; }
      .float-renew { display: none; }
    }

    @media (max-width: 960px) {
      .why-grid { grid-template-columns: repeat(2,1fr); }
      .platform-grid { grid-template-columns: 1fr; max-width: 520px; }
      .footer-top { grid-template-columns: 1fr 1fr; gap: 36px; }
      .float-alert { right: -30px; top: -26px; }
      .float-success { left: -40px; }
    }

    /* ── TABLET / MOBILE: hide desktop mockup, feature the phone ── */
    @media (max-width: 860px) {
      section { padding: 72px 20px; }
      .mockup-stage { padding: 64px 16px 88px; }
      .stage-inner { gap: 0; }
      .desktop-wrap { display: none; }
      .phone-wrap {
        width: min(290px, 74vw);
        transform: translateY(0);
        margin: 0 auto;
      }
      .phone-wrap:hover { transform: translateY(0); }
      .float-alert { display: none; }
      .float-success {
        left: auto;
        right: -14px;
        bottom: 74px;
        animation: floatMobile 3.6s ease-in-out infinite;
      }
      @keyframes floatMobile {
        0%,100% { transform: translateY(0) scale(.86); }
        50% { transform: translateY(-6px) scale(.86); }
      }
      .device-label { bottom: calc(100% + 18px); }
      .stage-glow-left { width: 380px; height: 380px; }
      .stage-glow-right { width: 320px; height: 320px; }
      .stage-glow-center { width: 520px; height: 300px; }
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hamburger { display: flex; }
      .hero { padding-top: 104px; }
      .hero-text { padding-bottom: 40px; }
      .hero-sub { font-size: 1rem; }
      .hero-badge { font-size: .74rem; padding: 7px 14px; }
      .install-badges { margin-bottom: 20px; }
      .install-badge { font-size: .74rem; padding: 5px 12px; }
      .btn-install { padding: 14px 30px; font-size: 1rem; }
      .device-pills { margin: 24px 0 4px; gap: 8px; }
      .device-pill { font-size: .76rem; padding: 6px 13px; }
      .steps-row { grid-template-columns: 1fr; }
      .why-grid { grid-template-columns: 1fr; }
      .footer-top { grid-template-columns: 1fr; gap: 32px; }
      .footer-bottom { flex-direction: column; align-items: flex-start; }
      .install-card { padding: 44px 24px; border-radius: 18px; }
      .install-card > p { font-size: .94rem; }
      .guide-tabs { gap: 8px; margin-bottom: 32px; }
      .guide-tab { padding: 9px 15px; font-size: .82rem; }
      .guide-tab svg { width: 16px; height: 16px; }
      .platform-card { flex-direction: column; gap: 14px; padding: 24px; }
      .cta-section { padding: 72px 20px; }
      .cta-section p { margin-bottom: 28px; }
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 1.95rem; }
      .hero-sub { font-size: .95rem; }
      .section-title { font-size: 1.6rem; }
      .section-subtitle { font-size: .95rem; }
      .phone-wrap { width: min(268px, 78vw); }
      .float-success { right: -8px; bottom: 60px; }
      .guide-tab { flex: 1 1 auto; justify-content: center; }
      .install-badge { flex: 1 1 auto; justify-content: center; }
      .mob-card-sub { display: none; }
    }

    @media (
